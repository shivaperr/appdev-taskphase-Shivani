<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>
    <p id="counter" class="counter" aria-live="polite">0 tasks left</p>

    <form id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input type="text" id="task-input" placeholder="What needs doing?" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-message" class="empty-message">No tasks yet. Type one above and press Add.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
